{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Notifications</h2>
    <div class="card">
        <div class="card-body">
            <div id="notificationList"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const res = await fetch('{% url "notifications:api_notifications" %}');
    const data = await res.json();
    const list = document.getElementById('notificationList');
    data.notifications.forEach(n => { list.innerHTML += `<div class="alert alert-${n.is_read|yesno:'secondary,primary'}">${n.title}: ${n.message}</div>`; });
});
</script>
{% endblock %}
