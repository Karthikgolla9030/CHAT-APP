{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Reports</h2>
    <div class="card">
        <div class="card-body">
            <p>Submit and view reports here.</p>
            <form id="reportForm" class="mt-3">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="reportUsername" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <select id="reportReason" class="form-select">
                        <option value="spam">Spam</option>
                        <option value="harassment">Harassment</option>
                        <option value="fake_profile">Fake Profile</option>
                        <option value="abuse">Abuse</option>
                        <option value="adult_content">Adult Content</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="reportDescription" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Report</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('reportForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('reportUsername').value;
    const reason = document.getElementById('reportReason').value;
    const description = document.getElementById('reportDescription').value;
    try {
        const res = await fetch("{% url 'reports:api_submit_report' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, reason, description })
        });
        const data = await res.json();
        alert(data.detail);
        if (res.ok) {
            document.getElementById('reportForm').reset();
        }
    } catch (error) {
        alert('Failed to submit report');
    }
});
</script>
{% endblock %}
