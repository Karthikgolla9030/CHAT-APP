{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold mb-4">Your Friends</h2>
    <div class="row" id="friendsContainer">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div id="friendsList">
                        <p class="text-muted text-center py-4">Loading your friends...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const res = await fetch('{% url "friends:api_friends" %}');
    const data = await res.json();
    const container = document.getElementById('friendsList');
    
    if (!data.friends || data.friends.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <div class="display-1 mb-3">👋</div>
                <h5 class="mb-2">No friends yet</h5>
                <p class="text-muted">Start matching to meet new people. After a conversation, you can add them as friends.</p>
                <a href="{% url 'core:search' %}" class="btn btn-primary">Start Matching</a>
            </div>
        `;
        return;
    }

    let html = '<div class="row g-3">';
    data.friends.forEach(f => {
        const statusClass = f.online === 'online' ? 'bg-success' : 'bg-secondary';
        const statusText = f.online === 'online' ? 'Online' : 'Offline';
        html += `
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; font-weight: bold;">
                                ${(f.display_name || f.username).charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-grow-1">
                                <h6 class="mb-0 fw-bold">${f.display_name || f.username}</h6>
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="mt-3 d-flex gap-2">
                            <a href="/chat/room/${f.chat_room_id || ''}" class="btn btn-primary btn-sm flex-grow-1">Chat</a>
                            <button class="btn btn-outline-danger btn-sm" onclick="removeFriend('${f.id}')">Remove</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
});

async function removeFriend(friendId) {
    if (!confirm('Remove this friend?')) return;
    await fetch(`/friends/api/remove-friend/${friendId}/`, { 
        method: 'DELETE', 
        headers: { 'X-CSRFToken': '{{ csrf_token }}' } 
    });
    location.reload();
}
</script>
{% endblock %}
