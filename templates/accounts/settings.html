{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title mb-4">Settings</h3>
                    <ul class="nav nav-tabs mb-4" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#general">General</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#notifications">Notifications</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#privacy">Privacy</button></li>
                        <li class="nav-item"><button class="nav-link text-danger" data-bs-toggle="tab" data-bs-target="#danger">Danger Zone</button></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="general">
                            <h5>General Settings</h5>
                            <form method="post">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label class="form-label">Theme</label>
                                    <select name="theme" class="form-select">
                                        <option value="dark" {% if user.profile.online_status == 'dark' %}selected{% endif %}>Dark</option>
                                        <option value="light" {% if user.profile.online_status == 'light' %}selected{% endif %}>Light</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Language</label>
                                    <select class="form-select">
                                        <option>English</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="notifications">
                            <h5>Notification Preferences</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" checked id="notifFriendRequests">
                                <label class="form-check-label" for="notifFriendRequests">Friend Requests</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" checked id="notifMessages">
                                <label class="form-check-label" for="notifMessages">New Messages</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" checked id="notifSystem">
                                <label class="form-check-label" for="notifSystem">System Notifications</label>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="privacy">
                            <h5>Privacy Settings</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" checked id="showOnline">
                                <label class="form-check-label" for="showOnline">Show online status</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="showProfile">
                                <label class="form-check-label" for="showProfile">Public profile</label>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="danger">
                            <h5 class="text-danger">Danger Zone</h5>
                            <p>Once you delete your account, there is no going back.</p>
                            <form method="post" action="{% url 'accounts:api_delete_account' %}" onsubmit="return confirm('Are you sure? This cannot be undone.')">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger">Delete Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
