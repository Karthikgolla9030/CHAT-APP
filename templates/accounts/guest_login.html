{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-center">Guest Login</h3>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Start Chatting</button>
                    </form>
                    <p class="mt-3 text-center"><a href="{% url 'accounts:register' %}">Create permanent account</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
